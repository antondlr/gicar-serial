# ---------------------------------------------------------------------------
# Sensors - counters only; every other value is shown by its writable twin.
# ---------------------------------------------------------------------------
sensor:
  - platform: gicar
    gicar_id: ascaso_bridge
    # XL slots: read-only, they have never been shown to accept a write.
    pre_infusion_soak_XL:
      name: "XL Pre-infusion Soak"
      icon: mdi:timer-sand
      entity_category: diagnostic
      disabled_by_default: true
      web_server: {sorting_group_id: grp_brewing, sorting_weight: 44}
    pre_infusion_XL:
      name: "XL Pre-infusion"
      icon: mdi:timer-sand
      entity_category: diagnostic
      disabled_by_default: true
      web_server: {sorting_group_id: grp_brewing, sorting_weight: 45}
    counter_S1:
      name: "S1 Counter"
      icon: mdi:counter
      web_server: {sorting_group_id: grp_counters, sorting_weight: 1}
    counter_S2:
      name: "S2 Counter"
      icon: mdi:counter
      web_server: {sorting_group_id: grp_counters, sorting_weight: 2}
    counter_L1:
      name: "L1 Counter"
      icon: mdi:counter
      web_server: {sorting_group_id: grp_counters, sorting_weight: 3}
    counter_L2:
      name: "L2 Counter"
      icon: mdi:counter
      web_server: {sorting_group_id: grp_counters, sorting_weight: 4}
    counter_flush:
      name: "Flush (XL) Counter"
