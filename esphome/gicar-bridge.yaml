      web_server: {sorting_group_id: grp_counters, sorting_weight: 5}
    counter_total:
      name: "Total Counter"
      icon: mdi:sigma
      web_server: {sorting_group_id: grp_counters, sorting_weight: 6}
    counter_lifetime:
      name: "Lifetime Counter"
      icon: mdi:sigma
      web_server: {sorting_group_id: grp_counters, sorting_weight: 7}
    # Has mirrored the lifetime counter in every dump taken so far - exposed
    # to see whether it is a true alias or its own accumulator.
    counter_water:
      name: "Water Counter"
      icon: mdi:water
      entity_category: diagnostic
      disabled_by_default: true
      web_server: {sorting_group_id: grp_counters, sorting_weight: 8}
    # Tea-equipped machines only; read zero on a Baby T Plus.
    counter_tea_1:
      name: "Tea 1 Counter"
      icon: mdi:tea
      entity_category: diagnostic
      disabled_by_default: true
      web_server: {sorting_group_id: grp_counters, sorting_weight: 10}
    counter_tea_2:
      name: "Tea 2 Counter"
      icon: mdi:tea
      entity_category: diagnostic
      disabled_by_default: true
      web_server: {sorting_group_id: grp_counters, sorting_weight: 11}
