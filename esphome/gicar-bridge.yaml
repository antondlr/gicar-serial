    name: "Uptime"
    entity_category: diagnostic
    web_server: {sorting_group_id: grp_bridge, sorting_weight: 3}
  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s
    web_server: {sorting_group_id: grp_bridge, sorting_weight: 4}
